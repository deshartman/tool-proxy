name: Deploy to Fly.io

# Push-to-deploy for the tool-proxy Fly app (`tool-proxy`).
#
# Fires on:
#   - `push` to `main` (PR merge or direct push both trigger it)
#   - Manual `workflow_dispatch` (force a redeploy without a code change)
#
# Delegates to the same `./scripts/deploy/fly-deploy.sh` operators use locally.
# See architectural-plans/GIT-FLY-DEPLOY.md for the full CI/CD design.
#
# Prereqs (one-time, out of scope for this workflow):
#   - Repo secret `FLY_API_TOKEN` set to a Fly deploy token scoped to the app.
#     Generate:
#       flyctl tokens create deploy \
#         --app tool-proxy \
#         --expiry 8760h \
#         --name github-actions \
#         | gh secret set FLY_API_TOKEN \
#             --repo deshartman/tool-proxy
#     Token expires after 1 year — rotate by rerunning the same command.
#   - `deploy/fly/fly.toml` exists in the repo (checked in — generated once via
#     `tool-proxy deploy init --target fly`).
#   - App + Postgres already exist on Fly (bootstrapped via a local
#     `./scripts/deploy/fly-deploy.sh` run). CI does the ongoing redeploy path
#     only; it does not re-bootstrap Postgres, volumes, or secrets. Those are
#     idempotent inside `tool-proxy deploy apply --target fly`, so a CI run
#     against a fresh app would work — but the first run is deliberately a
#     human-in-the-loop step per OPERATOR-RUNBOOK.md.

on:
  push:
    branches: [main]
    # Skip deploys for doc-only pushes AND empty commits. GitHub only skips
    # when every changed file matches an ignored path — and an empty commit
    # has zero changed files, which also triggers the skip. So
    # `git commit --allow-empty && git push` will NOT redeploy. To force a
    # deploy without a code change (e.g. redeploy the current image), use
    # `workflow_dispatch` instead — either the "Run workflow" button in the
    # Actions UI, or `gh workflow run deploy-main.yml --ref main`.
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'architectural-plans/**'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    # Depot self-hosted runner — no GitHub-hosted runners are attached to
    # internal repos in the twilio-demos org. `ubuntu-latest` would queue
    # forever with no runner_name assigned. See pr-checks.yml header for
    # the full org-policy explanation.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      # flyctl install via curl — Twilio-demos org policy blocks
      # `superfly/flyctl-actions/setup-flyctl` (not on the allowed_actions
      # whitelist). Curl-install is exactly what that action does under the
      # hood. Export ~/.fly/bin onto $GITHUB_PATH so subsequent steps see it.
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # We build here (not inside fly-deploy.sh) so that the shell script sees
      # a fresh dist/ and short-circuits its own build. `tool-proxy deploy
      # apply --target fly` needs connector/dist/index.js to spawn its five
      # idempotent Fly ops (see scripts/deploy/fly-deploy.sh header comment).
      - name: Build connector
        run: npm run build

      # --redeploy-only skips the 4-step Fly bootstrap (apps/postgres/secrets/
      # volumes create) — those need org-level permissions the app-scoped
      # FLY_API_TOKEN doesn't have. Once bootstrapped locally, ongoing
      # redeploys only need `fly deploy` which app-scoped tokens can run.
      # --skip-build tells the script to trust the freshly built dist/.
      # Same script operators use locally — CI and local flows share this
      # one code path so drift between them is structurally impossible.
      - name: Deploy to Fly
        run: ./scripts/deploy/fly-deploy.sh --redeploy-only --skip-build

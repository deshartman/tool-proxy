name: PR checks

# Typecheck + vitest suite on every PR into `main`.
#
# Twilio-demos org policy (also enforced on the sibling AgenticProcedure repo):
#   - Every action reference MUST be a full 40-char commit SHA. Tag/branch refs
#     are rejected at runtime with `startup_failure` and zero logs.
#   - Only whitelisted vendors (`actions/*`, `depot/*`, `aws-actions/*`,
#     `anthropics/*`, `oven-sh/*`) are allowed. `pnpm/action-setup` and
#     `superfly/flyctl-actions` are NOT — hence the curl-install of flyctl in
#     deploy-main.yml and the vanilla setup-node here.
#   - Bump versions by looking up tag → SHA:
#       gh api repos/actions/checkout/tags
#       gh api repos/actions/setup-node/tags
#
# See .claude/plans/GIT-FLY-DEPLOY.md for the full architecture rationale.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` is deterministic — it errors if package-lock.json disagrees with
      # package.json. Uses --workspaces to hoist deps for every MCP folder that
      # declares its own dependencies (drop-in MCPs may carry a package.json for
      # third-party SDKs; see CLAUDE.md "Workspace shape").
      - name: Install dependencies
        run: npm ci

      # `npm run build` at the workspace root runs `tsc -b connector` — this is
      # the typecheck. Emits dist/ as a side-effect; CI throws that away.
      - name: Typecheck (tsc -b)
        run: npm run build

      # Vitest lives under the connector workspace but reads --root .. so it
      # picks up the repo-root vitest.config.ts. `--passWithNoTests` matches the
      # package.json script; harmless in CI where tests always exist.
      - name: Test (vitest)
        run: npm test --workspace=@mcp-shim/connector

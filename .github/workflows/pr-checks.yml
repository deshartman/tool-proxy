name: PR checks

# Typecheck + vitest suite on every PR into `main`.
#
# See architectural-plans/GIT-FLY-DEPLOY.md for the full CI/CD design.
#
# Twilio-demos org policy (verified against the sibling AgenticProcedure repo):
#
#   1. `runs-on: depot-ubuntu-24.04` — NOT `ubuntu-latest`. The org attaches
#      NO GitHub-hosted runners to internal repos. Using `ubuntu-latest`
#      queues the job forever with no `runner_name` and no error message.
#      The `depot-ubuntu-24.04` label is a shared runner pool visible at
#      Settings → Actions → Runners.
#   2. `sha_pinning_required: true` — every action reference must be a full
#      40-char commit SHA. Tag/branch refs are rejected at runtime with
#      `startup_failure` and zero logs.
#   3. `allowed_actions: selected` — only whitelisted vendors work:
#      `actions/*`, `depot/*`, `aws-actions/*`, `anthropics/*`, `oven-sh/*`.
#      `pnpm/action-setup` and `superfly/flyctl-actions` are NOT — hence the
#      curl-install of flyctl in deploy-main.yml and the vanilla setup-node
#      here.
#
# Bump SHAs by looking up tag → SHA:
#   gh api repos/actions/checkout/tags --jq '.[0] | {name, sha: .commit.sha}'
#   gh api repos/actions/setup-node/tags --jq '.[0] | {name, sha: .commit.sha}'

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Depot self-hosted runner — no GitHub-hosted runners are attached to
    # internal repos in the twilio-demos org. `ubuntu-latest` would queue
    # forever with no runner_name assigned.
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` is deterministic — it errors if package-lock.json disagrees with
      # package.json. Uses --workspaces to hoist deps for every MCP folder that
      # declares its own dependencies (drop-in MCPs may carry a package.json for
      # third-party SDKs; see CLAUDE.md "Workspace shape").
      - name: Install dependencies
        run: npm ci

      # `npm run build` at the workspace root runs `tsc -b connector` — this is
      # the typecheck. Emits dist/ as a side-effect; CI throws that away.
      - name: Typecheck (tsc -b)
        run: npm run build

      # Vitest lives under the connector workspace but reads --root .. so it
      # picks up the repo-root vitest.config.ts. `--passWithNoTests` matches the
      # package.json script; harmless in CI where tests always exist.
      - name: Test (vitest)
        run: npm test --workspace=@gtmi/toolproxy-connector

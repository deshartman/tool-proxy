[project]
name = "customer-ek-mcp"
version = "0.0.1"
description = "Enterprise Knowledge MCP server (LlamaIndex-backed) for the mcp-shim connector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Twilio" }]

# Default deps: Ollama sidecar embedder. The model runs in a separate
# container (see docker-compose.dev.yml); the bundle only needs the HTTP
# adapter. No cloud API keys, no outbound embedding calls, no heavyweight
# in-process ML deps.
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "llama-index-core>=0.11,<0.13",
  "llama-index-vector-stores-postgres>=0.2",
  "llama-index-embeddings-ollama>=0.2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]

# Google Drive reader. Install with `uv pip install -e .[gdrive]` when
# any sources.yaml entry points at a Drive folder. Same lockdown
# discipline as [local]: deployments that don't use Drive must NOT
# install this — keeps googleapis.com out of the bundle's reachable
# surface.
gdrive = [
  "llama-index-readers-google>=0.4",
]

[project.scripts]
customer-ek-mcp = "customer_ek_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ek_mcp"]

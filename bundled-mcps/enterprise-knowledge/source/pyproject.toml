[project]
name = "customer-ek-mcp"
version = "0.0.1"
description = "Enterprise Knowledge MCP server (LlamaIndex-backed) for the mcp-shim connector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Twilio" }]

# Default deps: Ollama sidecar embedder. The model runs in a separate
# container (see deploy/compose/docker-compose.dev.yml); the bundle only needs the HTTP
# adapter. No cloud API keys, no outbound embedding calls, no heavyweight
# in-process ML deps.
#
# C10 (security hardening) — versions pinned to exact `==` so a fresh
# `pip install` (or Docker rebuild) resolves to the same tree that CI
# and dev tested. Silent transitive updates in the LLM ecosystem
# (llama-index has broken APIs between minor versions) or a
# compromised transitive that lands via a fuzzy pin can't sneak in.
# Bump these deliberately via a Renovate/Dependabot PR, verify tests,
# merge. Do NOT relax to `>=` / `^` — the whole point is the pin.
dependencies = [
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "llama-index-core==0.12.52.post1",
  "llama-index-vector-stores-postgres==0.5.5",
  "llama-index-embeddings-ollama==0.6.0",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]

# Google Drive reader. Install with `uv pip install -e .[gdrive]` when
# any sources.yaml entry points at a Drive folder. Same lockdown
# discipline as [local]: deployments that don't use Drive must NOT
# install this — keeps googleapis.com out of the bundle's reachable
# surface. C10: `==` pin.
gdrive = [
  "llama-index-readers-google==0.6.2.post1",
]

[project.scripts]
customer-ek-mcp = "customer_ek_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ek_mcp"]

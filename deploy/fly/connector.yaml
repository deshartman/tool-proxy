# Fly deploy — connector config delivered into the Machine via [[files]] in
# fly.toml (guest_path /etc/tool-proxy/config.yaml).
#
# The drop-in scanner auto-discovers every Twilio-authored MCP from
# /app/bundled-mcps/ (agentic-memory plus the demo drop-ins the image ships),
# so mcp_servers stays empty. Only a hand-written Type 1 MCP — one shipping
# its own server.ts — would need an entry here.

mcp_servers: []

policy:
  fail_mode: fail_fast
  log_tool_args: redacted
  max_concurrent_calls: 64
  discovery_interval_ms: 30000
  heartbeat_interval_ms: 1500
  tool_timeout_ms: 5000

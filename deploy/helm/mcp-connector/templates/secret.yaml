apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-connector.fullname" . }}-auth
  labels:
    {{- include "mcp-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.connector.auth "static" }}
  TUNNEL_AUTH_TOKEN: {{ required "connector.auth=static requires secrets.tunnelAuthToken (or provide via external secret manager)" .Values.secrets.tunnelAuthToken | quote }}
  {{- else if eq .Values.connector.auth "oauth2" }}
  OAUTH_CLIENT_ID: {{ required "connector.auth=oauth2 requires secrets.oauthClientId" .Values.secrets.oauthClientId | quote }}
  OAUTH_CLIENT_SECRET: {{ required "connector.auth=oauth2 requires secrets.oauthClientSecret" .Values.secrets.oauthClientSecret | quote }}
  OAUTH_TOKEN_URL: {{ required "connector.auth=oauth2 requires secrets.oauthTokenUrl" .Values.secrets.oauthTokenUrl | quote }}
  {{- else }}
    {{- fail (printf "connector.auth must be \"static\" or \"oauth2\"; got %q" .Values.connector.auth) }}
  {{- end }}
  POSTGRES_URL: {{ required "secrets.postgresUrl is required — the connector stores its tunnel identity in Postgres" .Values.secrets.postgresUrl | quote }}

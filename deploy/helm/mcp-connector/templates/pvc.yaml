apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp-connector.fullname" . }}-state
  labels:
    {{- include "mcp-connector.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

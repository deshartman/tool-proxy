# The connector's ENTIRE secret surface: one 32-byte libsodium master key.
#
# Everything that used to live here is gone. TUNNEL_AUTH_TOKEN and the three
# OAUTH_* values were retired by ENV-TO-DB (they are entered in the inspector's
# Configure Tunnel modal and sealed at rest); POSTGRES_URL was retired by
# DB-TO-FILE (the store is a sealed JSON file on the PVC). Each of those was a
# `required`, so `helm install` could not succeed without supplying values the
# connector would then ignore.
#
# Delivered as CONNECTOR_KEY_B64 rather than a mounted file: entrypoint.sh
# base64-decodes it into CONNECTOR_KEY_FILE at 0400, chowns it to `mcp`, and
# unsets the variable before dropping privileges — so it never reaches
# /proc/1/environ of the connector process. That keeps this chart to one
# Kubernetes object instead of a Secret plus a projected volume.
#
# For production, source this from External Secrets / sealed-secrets / the CSI
# driver rather than --set. See README.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tool-proxy.fullname" . }}-auth
  labels:
    {{- include "tool-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONNECTOR_KEY_B64: {{ required "secrets.connectorKeyB64 is required — the 32-byte master key that seals the config store. Generate with: head -c 32 /dev/urandom | base64" .Values.secrets.connectorKeyB64 | quote }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tool-proxy.fullname" . }}
  labels:
    {{- include "tool-proxy.labels" . | nindent 4 }}
spec:
  # Single replica by design. The connector persists registrationToken to
  # a PVC; a second replica would open its own tunnel and trip the
  # controller's dup-name guard. Do not raise this.
  replicas: 1
  selector:
    matchLabels:
      {{- include "tool-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tool-proxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — pin an explicit version (do NOT use 'latest'). Set via --set image.tag=<version> or values override." .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # CONNECTOR_NAME and CONTROLLER_URL used to be `required` here.
            # Both were retired by ENV-TO-DB — identity is entered in the
            # inspector's Configure Tunnel modal and sealed into the PVC — so
            # the chart was demanding values it would then ignore.
            - name: CONNECTOR_CONFIG
              # Optional yaml. Nothing in this chart mounts it; loadConfig
              # tolerates the file being absent, and the only shape that still
              # needs an entry is a hand-written Type 1 MCP.
              value: /etc/tool-proxy/config.yaml
            - name: HEALTH_PORT
              # Orchestrator probes, on their own tiny server bound 0.0.0.0 with
              # exactly two GET routes. The inspector CANNOT be probed: it binds
              # 127.0.0.1 and refuses every non-loopback caller, so a kubelet
              # probe against the pod IP gets 403. 9100 avoids 9091, which the
              # multi-instance dev script uses as a second inspector port.
              value: "9100"
            - name: INSPECTOR_PORT
              # Load-bearing: never expose this port via a Service. The
              # inspector binds 127.0.0.1 inside the pod. `kubectl port-forward`
              # is the intended access path.
              value: "9090"
            - name: CONNECTOR_KEY_FILE
              # The one variable requireEnv() demands. Must be set explicitly
              # even though entrypoint.sh defaults to the same path internally:
              # the entrypoint does not EXPORT its default, so leaving this
              # unset writes the key and then fails the preflight.
              #
              # The bytes arrive as CONNECTOR_KEY_B64 via envFrom below; the
              # entrypoint decodes to this path at 0400 and unsets the variable
              # before dropping privileges.
              value: /etc/tool-proxy/connector.key
          envFrom:
            - secretRef:
                name: {{ include "tool-proxy.fullname" . }}-auth
          ports:
            - name: inspector
              containerPort: 9090
            - name: health
              containerPort: 9100
          # Liveness asks "restart this pod?" and must NOT consult the tunnel.
          # If it did, one controller outage would make every kubelet in the
          # fleet kill its connector simultaneously — exactly when the
          # decorrelated-jitter backoff is trying to spread the herd out.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness asks "send it work?" — so it DOES gate on the tunnel, and
          # on children still starting.
          #
          # There is no Service in front of this by default, so readiness does
          # not steer traffic; it is a status signal for `kubectl get pods` and
          # for rollout gating. That matters because of the next point.
          #
          # A FRESH DEPLOY IS DELIBERATELY NOT READY. /readyz returns 503
          # tunnel_not_open until an operator completes Configure Tunnel, which
          # is a human step reached via `kubectl port-forward`. Hence
          # failureThreshold 30 x 10s = 5 minutes of grace, and hence liveness
          # being a separate, unconditional probe: the pod must survive long
          # enough to be configured. If your rollout gates on readiness, expect
          # a first deploy to sit unready until someone fills in the modal.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Holds state/config.json — the sealed config store. The PVC root
            # arrives root-owned (as every CSI driver mounts it), which is why
            # entrypoint.sh creates and chowns the state/ subdirectory while it
            # is still root. See DEFAULT_STATE_DIR in src/config-store/store-file.ts.
            - name: state
              mountPath: /var/lib/tool-proxy
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "tool-proxy.fullname" . }}-state

# Default values for the tool-proxy chart. Override these on
# `helm install --set` or a values.yaml file.
#
# Note what is NOT here: connector name, controller URL, and auth posture.
# Those are entered in the inspector's Configure Tunnel modal after the pod is
# running (`kubectl port-forward`, see README.md) and sealed into the PVC. The
# chart used to `required` them as env vars and they no longer do anything.

image:
  repository: ghcr.io/twilio-demos/tool-proxy
  # C2 (security hardening) — do NOT default to `latest`. Silent
  # supply-chain drift on rebuild is a real threat class. Operators must
  # pin an explicit version tag (or better, an image digest `@sha256:...`)
  # via `--set image.tag=<version>` or a values override file.
  tag: ""
  pullPolicy: IfNotPresent
  # Optional: list of secret names for private registries.
  pullSecrets: []

# Measured floor is 493 MB — the connector plus the four bundled demo MCPs,
# where each Type 1 child is THREE processes (a `tsx` wrapper node, the real
# node, and a resident esbuild service). A 512 Mi limit cannot boot the shipped
# image, and the symptom is the fourth child dying at its readiness probe with
# no output, which reads as a broken MCP rather than an undersized pod.
# MCP_READINESS_TIMEOUT_MS does not help: the memory is absent, not late.
#
# The request is the number that matters — it is what the scheduler reserves,
# and a 256 Mi request on a busy node gets the pod placed somewhere it will be
# OOM-killed under load.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Persistent volume for the sealed config store at
# /var/lib/tool-proxy/state/config.json, plus the bundled agentic-memory
# MCP's state file. ReadWriteOnce is sufficient — the chart hardcodes
# replicas: 1 by design.
#
# This PVC IS the connector's identity: config.json holds the sealed tunnel
# bearer and the registration token the controller issued. Delete it and the
# operator must re-run Configure Tunnel, and the re-register collides on
# `name_taken` until someone clears the stale controller row.
persistence:
  size: 64Mi
  storageClassName: ""

# Secret content. For production, prefer an external secret operator
# (external-secrets, sealed-secrets, CSI driver) — do not commit real
# values here.
secrets:
  # The 32-byte libsodium master key, base64-encoded. The ONLY secret the
  # connector needs. entrypoint.sh decodes it to CONNECTOR_KEY_FILE at boot.
  #
  #   head -c 32 /dev/urandom | base64
  #
  # Rotating it does NOT re-seal the store — the fingerprint check in
  # ConfigStore.open() will refuse to start against a store sealed with the
  # old key. Rotation means: keep the old key, or discard the PVC and
  # reconfigure the tunnel.
  connectorKeyB64: ""

# The chart does NOT create a Service for the inspector port by default.
# The inspector binds 127.0.0.1 inside the pod; expose it via kubectl
# port-forward, not a Service — that stays the recommended path for
# operator-only access.
#
# CONNECTOR-NETWORK-EXPOSURE — set networkAccess.enabled: true to render a
# Service for the inspector port when you want it reachable from elsewhere
# in the cluster (e.g. a machine caller hitting the /oauth/token API). This
# alone does NOT expose anything unauthenticated: only /oauth/token is
# ever reachable non-loopback, gated by a machine caller's own client_id/
# client_secret (see docs/NETWORK-ACCESS.md). The dashboard itself never
# becomes reachable this way, under any configuration. Enabling this
# Service without also adding an API client from the inspector's loopback
# session is a no-op: the app still 403s /oauth/token until one exists.
networkAccess:
  enabled: false
  # ClusterIP keeps this inside the cluster network by default; switch to
  # LoadBalancer/NodePort only if you've deliberately decided the connector
  # should be reachable from outside the cluster too.
  serviceType: ClusterIP

# Production docker-compose for the mcp-connector — single-VM shape.
#
# One container. The connector's config store is a sealed JSON file on the
# `state` volume (see architectural-plans/DB-TO-FILE.md) — there is no
# database service and no DSN. Drop customer MCPs at ./customer-mcps/<name>/
# and they get picked up automatically by the drop-in scanner.
#
# Pre-flight (one time), from the repo root:
#   1. Mint a 32-byte master key:
#      head -c 32 /dev/urandom > ./deploy/compose/secrets/connector.key
#      chmod 400 ./deploy/compose/secrets/connector.key
#   2. Copy the compose env template:
#      cp deploy/compose/.env.example deploy/compose/.env
#      # then edit MCP_VERSION if you don't want :latest
#
# Bring up (from the repo root):
#   docker compose -f deploy/compose/docker-compose.prod.yml up -d
#   docker compose -f deploy/compose/docker-compose.prod.yml \
#     exec connector node dist/index.js doctor
#
# `node dist/index.js`, not `mcp-connector`: the image's WORKDIR is
# /app/connector and the workspace bin link at /app/node_modules/.bin is not
# on PATH, so the bare name fails with "not found".
#
# Reach the inspector (loopback-only on the container — port-mapping stays
# on 127.0.0.1 on the host too):
#   open http://localhost:9090/
#
# Bind tunnel identity via the inspector's Configure Tunnel modal on first
# boot. No .env edits needed — identity is sealed into the state volume.

services:
  connector:
    image: ghcr.io/twilio/mcp-connector:${MCP_VERSION:-latest}
    env_file:
      # Optional: not required to exist so `docker compose config` can lint
      # this file in CI without a live env. In prod the operator populates
      # this via `cp deploy/compose/.env.example deploy/compose/.env`.
      - path: .env
        required: false
    environment:
      # The only required env var. Everything else — controller URL,
      # connector name, auth posture — is entered in the inspector's
      # Configure Tunnel modal and sealed into the state volume.
      CONNECTOR_KEY_FILE: /etc/mcp-connector/connector.key
      CONNECTOR_CONFIG: /etc/mcp-connector/config.yaml
      INSPECTOR_PORT: "9090"
    ports:
      # 127.0.0.1 only. Inspector loopback trust boundary — the Webhooks
      # panel exposes copy-able bcrypt-protected URLs. Do NOT change to
      # 0.0.0.0 or expose behind a public LB. Reach it via SSH tunnel:
      #   ssh -L 9090:127.0.0.1:9090 <vm-host>
      - "127.0.0.1:9090:9090"
    volumes:
      # state — writable. Holds config.json: the sealed controllers record
      # (tunnel bearer + registration token) plus machine-API clients. This
      # volume IS the connector's identity now that there is no database.
      # Destroy it and the operator must re-run Configure Tunnel; the
      # controller then mints a fresh connectors row on a name collision.
      #
      # A docker NAMED volume is the one mount type seeded from the image
      # with its ownership intact, so the `mcp` uid can write here without
      # the entrypoint chown the cloud targets need (CLAUDE.md, "A mounted
      # volume shadows the image directory").
      - state:/var/lib/mcp-connector
      # config — read-only. Ships alongside the compose file.
      - ./connector.yaml:/etc/mcp-connector/config.yaml:ro
      # master key — read-only, permissions 0400 on the host. Seals the
      # credentials in config.json above; a volume snapshot without this
      # file yields nothing.
      - ./secrets/connector.key:/etc/mcp-connector/connector.key:ro
      # customer drop-in MCPs — read-only. Auto-discovered at boot.
      # Path is relative to this compose file (deploy/compose/) — up two to
      # repo-root customer-mcps/. The scanner ignores this mount if the
      # directory is absent.
      - ../../customer-mcps:/var/lib/mcp-connector/customer-mcps:ro
    restart: unless-stopped

volumes:
  state:

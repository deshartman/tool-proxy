# Dev-only Postgres for the `crm` demo's mock backend
# (examples/mock-backend/). Started for you by scripts/start-mock-server.sh.
#
# NOT the connector's config store. It used to be — the connector kept its
# sealed `controllers` row here — but DB-TO-FILE replaced that with a sealed
# JSON file on the state volume, so the connector needs no database at all.
# This file survives only because the mock CRM backend is genuinely
# Postgres-backed (swapping it for a real Salesforce/Zendesk is a mock-side
# change; the drop-in stays a `fetch` client).
#
# POSTGRES_DB below seeds `mcp_connector` and that name is now vestigial —
# start-mock-server.sh uses it for the readiness probe and then CREATEs the
# `crm` database it actually wants. Renaming it would only reseed on a fresh
# volume, so it is left alone deliberately.

services:
  postgres:
    image: postgres:16
    container_name: tool-proxy-postgres
    environment:
      POSTGRES_DB: mcp_connector
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mcp-dev-password}
    ports:
      # Host 5433 (not 5432) to avoid colliding with another local Postgres
      # — e.g. a sibling project's container. Container-internal port stays
      # 5432; only the host-side mapping moves.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_connector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16
    container_name: mcp-shim-postgres
    environment:
      POSTGRES_DB: mcp_connector
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mcp-dev-password}
    ports:
      # Host 5433 (not 5432) to avoid colliding with another local Postgres
      # — e.g. a sibling project's container. Container-internal port stays
      # 5432; only the host-side mapping moves.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_connector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

# fly.toml app configuration file generated for mcp-shim-poc on 2026-05-31T08:22:57+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mcp-shim-poc'
primary_region = 'iad'

# Single machine by design.
#
# The architecture's state — the per-shim MCP tunnel and the in-memory
# registry — lives in process memory. With Fly's default 2-machine HA
# setup, a shim's tunnel lands on one machine while a /query request
# round-robins to the other and finds an empty registry. Scaling to one
# machine pins all state to a single process.
#
# To restore HA in a real deployment you'd either:
#   (a) tag each registered shim with FLY_MACHINE_ID and use fly-replay
#       to bounce queries to the machine holding the shim's tunnel; or
#   (b) move the registry to a shared store (Redis / LiteFS).

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/registry'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[project]
name = "customer-ek-mcp"
version = "0.0.1"
description = "Enterprise Knowledge MCP server (LlamaIndex-backed) for the mcp-shim connector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Twilio" }]

# Step 2 lands a stub backend. The real LlamaIndex backend lands in step 4
# of LLAMA-INDEX.md — at that point this list grows. Keeping it minimal
# now so `uv pip install -e .` / `uvx customer-ek-mcp` is fast and so the
# stub can be exercised end-to-end without pulling in heavyweight deps.
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Backend deps that step 4 will move into `dependencies`. Held separately
# now so the stub bundle stays installable without LlamaIndex weight.
llamaindex = [
  "llama-index-core>=0.11",
  "llama-index-vector-stores-postgres>=0.2",
  "llama-index-vector-stores-chroma>=0.2",
  "llama-index-embeddings-huggingface>=0.3",
  "llama-index-readers-web>=0.2",
  "psycopg[binary]>=3.2",
  "chromadb>=0.5",
]

[project.scripts]
customer-ek-mcp = "customer_ek_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ek_mcp"]

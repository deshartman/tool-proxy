[project]
name = "customer-ek-mcp"
version = "0.0.1"
description = "Enterprise Knowledge MCP server (LlamaIndex-backed) for the mcp-shim connector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Twilio" }]

# Default deps assume the production lockdown shape: OpenAI embedder, no
# unsanctioned outbound. Customers picking EK_EMBEDDER=local must
# explicitly install the [local] extra below — keeps llama-index-embeddings
# -huggingface (and its huggingface-hub / transformers / sentence-transformers
# transitive deps) out of the venv when the deployment isn't going to use them.
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "llama-index-core>=0.11,<0.13",
  "llama-index-vector-stores-postgres>=0.2",
  "llama-index-embeddings-openai>=0.2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Install with `uv pip install -e .[local]` (or `pip install customer-ek-mcp
# [local]`) when EK_EMBEDDER=local. Required only for that path; OpenAI
# deployments must NOT install this to keep huggingface.co out of the
# bundle's reachable network surface.
local = [
  "llama-index-embeddings-huggingface>=0.3",
]

[project.scripts]
customer-ek-mcp = "customer_ek_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ek_mcp"]

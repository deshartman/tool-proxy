[project]
name = "customer-ek-mcp"
version = "0.0.1"
description = "Enterprise Knowledge MCP server (LlamaIndex-backed) for the mcp-shim connector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Twilio" }]

dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7",
  "llama-index-core>=0.11,<0.13",
  "llama-index-vector-stores-postgres>=0.2",
  "llama-index-embeddings-huggingface>=0.3",
  "psycopg[binary]>=3.2",
]

[project.scripts]
customer-ek-mcp = "customer_ek_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ek_mcp"]

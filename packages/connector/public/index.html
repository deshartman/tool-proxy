<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCP Connector Inspector</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>MCP Connector Inspector</h1>
      <div class="meta">
        <span class="muted">controller:</span>
        <code id="controller-url">…</code>
      </div>
      <div class="meta">
        <span class="muted">identity:</span>
        <span id="identity" class="identity identity-unknown">…</span>
      </div>
    </div>
    <span id="status" class="status status-connecting">connecting…</span>
  </header>

  <main id="main">
    <aside id="left-col">
      <section id="manifest-pane" class="collapsible" data-key="manifest">
        <h2 class="section-head">
          <span class="caret">▾</span>
          <span class="section-title">MCP Servers</span>
        </h2>
        <div class="section-body">
          <div id="manifest-empty" class="empty">No manifest yet — connector hasn't built one.</div>
          <div id="manifest" hidden>
            <div class="meta-row"><span class="muted">connectorId</span><code id="m-connector"></code></div>
            <div class="meta-row"><span class="muted">environment</span><code id="m-env"></code></div>
            <div class="meta-row"><span class="muted">version</span><code id="m-ver"></code></div>
            <div id="m-servers"></div>
          </div>
        </div>
      </section>

      <section id="frames-pane" class="collapsible" data-key="frames">
        <h2 class="section-head">
          <span class="caret">▾</span>
          <span class="section-title">Frames</span>
          <span class="controls">
            <label><input type="checkbox" id="show-heartbeats"> heartbeats</label>
            <button id="reconnect">reconnect</button>
            <button id="clear">clear</button>
          </span>
        </h2>
        <div class="section-body">
          <ol id="frames" class="empty"><li class="empty-msg">No frames yet.</li></ol>
        </div>
      </section>
    </aside>

    <button id="col-resizer" type="button" aria-label="Resize columns"></button>

    <section id="detail-pane">
      <h2 id="detail-title">Detail</h2>
      <div id="detail-empty" class="empty">Click a tool or frame on the left to inspect.</div>
      <div id="detail-content" hidden></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

# Customer A — SRE team
shimId: shim-a
sources:
  - id: incident-response-p1
    type: filesystem
    path: ../docs/incident-response.md
    description: "P1 Incident Response runbook. Covers acknowledgement, roles, mitigation, communication cadence, escalation, and postmortem requirements for customer-impacting outages. Use for: incidents, outages, services down, broken, page, paging, on-call, oncall, acknowledge, mitigate, rollback, escalate, customer impact, payment down, database down, server down, api down, service degraded, sev1, p1, sev2, p2, postmortem."
    # Demo-only "Change" affordance: clicking the Change button in the UI
    # swaps step 1 of the document between these two variants and re-saves.
    # Used to demo the freshness guarantee — re-asking the same question
    # immediately reflects the new step.
    variants:
      original: |-
        1. **Acknowledge the page within 5 minutes.** Use PagerDuty or the on-call rotation; if neither is reachable, call the SRE manager directly.
      alternate: |-
        1. **Acknowledge the page within 90 seconds.** Updated after the Q1 SEV-0 retrospective. Use PagerDuty; if it does not resolve in 30s, switch to the secondary on-call channel and page the SRE Director directly. The 5-minute window is no longer acceptable.
